apiVersion: v1
kind: Namespace
metadata:
  name: pi-sandbox-system
  labels:
    app: sandbox-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: pi-sandbox
  labels:
    app: sandbox
---
# Sandboxes get no service account token and no network by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pi-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-manager
  namespace: pi-sandbox-system
---
# The manager may only manage pods inside pi-sandbox. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: pi-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager
  namespace: pi-sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: pi-sandbox-system
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  namespace: pi-sandbox-system
  labels:
    app: sandbox-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-manager
  template:
    metadata:
      labels:
        app: sandbox-manager
    spec:
      serviceAccountName: sandbox-manager
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/duke-ece/sandbox-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: SANDBOX_NAMESPACE
              value: pi-sandbox
            - name: MAX_SANDBOXES
              value: "10"
            - name: DEFAULT_TTL_SECONDS
              value: "900"
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
  namespace: pi-sandbox-system
  labels:
    app: sandbox-manager
spec:
  type: ClusterIP
  selector:
    app: sandbox-manager
  ports:
    - port: 50051
      targetPort: 50051
