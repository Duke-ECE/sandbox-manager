apiVersion: v1
kind: Namespace
metadata:
  name: pi-sandbox-system
  labels:
    app: sandbox-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: pi-sandbox
  labels:
    app: sandbox
---
# Sandboxes get no service account token and no network by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pi-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-manager
  namespace: pi-sandbox-system
---
# The manager may only manage pods inside pi-sandbox. Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: pi-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-manager
  namespace: pi-sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-manager
    namespace: pi-sandbox-system
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-manager
  namespace: pi-sandbox-system
  labels:
    app: sandbox-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-manager
  template:
    metadata:
      labels:
        app: sandbox-manager
    spec:
      serviceAccountName: sandbox-manager
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: server
          image: ghcr.io/duke-ece/sandbox-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: SANDBOX_NAMESPACE
              value: pi-sandbox
            - name: MAX_SANDBOXES
              value: "10"
            - name: DEFAULT_TTL_SECONDS
              value: "900"
            - name: POOL_SIZE
              value: "3"
            - name: EXEC_TIMEOUT_SECONDS
              value: "60"
            - name: MAX_OUTPUT_BYTES
              value: "1048576"
            # Single-node Cube development pilot. CubeMaster stays private;
            # only CubeAPI/CubeProxy are reached through the existing HTTPS ingress.
            - name: CUBE_API_URL
              value: "https://cube.weihao.duckdns.org:10443"
            - name: CUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cube-api-key
                  key: api_key
            - name: CUBE_TEMPLATE_ID
              value: "tpl-969e7ae7ac964f59be82551a"
            - name: CUBE_PROXY_NODE_IP
              value: "cube.weihao.duckdns.org"
            - name: CUBE_PROXY_PORT
              value: "10443"
            - name: CUBE_PROXY_SCHEME
              value: "https"
            - name: CUBE_SANDBOX_DOMAIN
              value: "weihao.duckdns.org"
            - name: CUBE_MAX_SESSIONS
              value: "2"
            - name: CUBE_TTL_SECONDS
              value: "1800"
            # busybox stands in until a real sandbox-worker image exists;
            # pool pods are started with `sleep infinity`, so it stays alive.
            - name: DEFAULT_IMAGE
              value: busybox:1.36
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
  namespace: pi-sandbox-system
  labels:
    app: sandbox-manager
spec:
  type: ClusterIP
  selector:
    app: sandbox-manager
  ports:
    - port: 50051
      targetPort: 50051
